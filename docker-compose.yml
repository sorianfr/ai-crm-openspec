services:
  db:
    image: postgres:16
    container_name: crm-postgres
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-app
    environment:
      # En producción exige DATABASE_URL; aquí lo ponemos explícito
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  crm_pgdata:
