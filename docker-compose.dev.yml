services:
  db:
    image: postgres:16
    container_name: crm-postgres-dev
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-app-dev
    env_file: .env.dev
    environment:
      APP_ENV: development
      DEBUG: "true"
      DB_HOST: db
      DB_USER: crm
      DB_NAME: crm
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  crm_pgdata_dev:
