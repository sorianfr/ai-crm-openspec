# Placeholder secret; override in overlays or replace with sealed-secret / external secret.
# Keys match app env from docker-compose.prod (.env.prod + environment): DATABASE_URL, JWT_SECRET, SESSION_SECRET.
apiVersion: v1
kind: Secret
metadata:
  name: crm-app-secret
  namespace: crm
  labels:
    app.kubernetes.io/name: crm
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://crm:crm@postgres:5432/crm"
  JWT_SECRET: "change-me-in-production"
  SESSION_SECRET: "change-me-in-production"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: crm
  labels:
    app.kubernetes.io/name: crm
type: Opaque
stringData:
  POSTGRES_USER: "crm"
  POSTGRES_PASSWORD: "crm"
  POSTGRES_DB: "crm"
