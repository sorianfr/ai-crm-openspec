apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-app
  namespace: crm
  labels:
    app.kubernetes.io/name: crm
    app: crm-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crm-app
  template:
    metadata:
      labels:
        app: crm-app
        app.kubernetes.io/name: crm
    spec:
      containers:
        - name: app
          image: crm-app:latest
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: crm-app-config
            - secretRef:
                name: crm-app-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
